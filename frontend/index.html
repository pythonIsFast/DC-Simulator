<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datacenter Tycoon</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <!-- Login / world menu (shown before a world is open) -->
  <main id="menu" class="overlay">
    <div class="card">
      <h1>Datacenter Tycoon</h1>
      <section id="view-auth" hidden>
        <form id="auth-form">
          <input id="auth-user" placeholder="Username" autocomplete="username" required>
          <input id="auth-pass" type="password" placeholder="Password (min. 8 characters)" autocomplete="current-password" required>
          <div class="row">
            <button type="submit" data-mode="login">Log in</button>
            <button type="submit" data-mode="register" class="secondary">Register</button>
          </div>
        </form>
      </section>
      <section id="view-worlds" hidden>
        <p id="who-line">Logged in as <strong id="who"></strong> <button id="logout" class="secondary small">Log out</button></p>
        <h2>Your worlds</h2>
        <ul id="world-list" class="plain"></ul>
        <h2>New world</h2>
        <form id="world-form">
          <input id="world-name" placeholder="World name" maxlength="40">
          <input id="company-name" placeholder="Company name" maxlength="40">
          <label>AI rivals <input id="ai-count" type="number" min="0" max="5" value="3"></label>
          <button type="submit">Create world</button>
        </form>
      </section>
      <details id="transfer" hidden>
        <summary>Move saves to another device</summary>
        <div id="transfer-body"></div>
      </details>
      <p id="msg" role="status"></p>
    </div>
  </main>

  <!-- Game HUD -->
  <div id="hud" hidden>
    <header id="topbar">
      <div class="money"><span id="cash">$0</span><span id="net" class="muted"></span><div id="popups"></div></div>
      <div class="clock"><span id="date"></span>
        <div class="speed" id="speed-buttons">
          <button data-speed="0" title="Pause (Space)">&#10074;&#10074;</button>
          <button data-speed="1" title="1x">1x</button>
          <button data-speed="2" title="2x">2x</button>
          <button data-speed="5" title="5x">5x</button>
        </div>
      </div>
      <nav class="tools">
        <button id="btn-decisions" class="warnbtn" hidden>Decision <span id="decision-badge" class="badge"></span></button>
        <button data-drawer="contracts">Contracts</button>
        <button data-drawer="team">Team <span id="team-badge" class="badge" hidden></span></button>
        <button data-drawer="research">Research</button>
        <button data-drawer="market">Overview</button>
        <button id="btn-mute" class="secondary" title="Mute (M)">&#128266;</button>
        <button id="btn-menu" class="secondary" title="Back to menu">&#9776;</button>
      </nav>
    </header>
    <div id="crumbs"></div>
    <div id="guide" hidden></div>
    <aside id="context"></aside>
    <aside id="drawer" hidden></aside>
    <button id="sheet-toggle" class="secondary small" title="Show/hide panel">&#9662;</button>
    <div id="toasts"></div>
    <div id="tooltip" hidden></div>
    <div id="banner" hidden></div>
    <div id="decision" class="overlay" hidden></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
