name: Release (Windows portable)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Build portable exe
        shell: bash
        run: |
          pyinstaller --onefile --name DatacenterTycoon \
            --paths backend \
            --add-data "backend/schema.sql;." \
            --add-data "frontend;frontend" \
            --hidden-import routes.auth_routes \
            --hidden-import routes.world_routes \
            --hidden-import data.game_config \
            --hidden-import data.hardware \
            --hidden-import data.research \
            --hidden-import data.world_seed \
            backend/app.py

      - name: Smoke test (server starts)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DatacenterTycoon.exe -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-RestMethod http://127.0.0.1:5000/api/health
          Stop-Process -Id $p.Id -Force
          if ($r.status -ne "ok") { throw "health check failed" }

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist\DatacenterTycoon.exe out\
          Compress-Archive -Path dist\DatacenterTycoon.exe -DestinationPath out\DatacenterTycoon-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DatacenterTycoon-windows-portable
          path: out/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chaquopy needs a build Python matching its target version (3.12).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Collect files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/DatacenterTycoon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DatacenterTycoon-android
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
